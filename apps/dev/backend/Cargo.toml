[package]
name = "dev-backend"
description = "Dev: the Rust side of the app."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Gzip, both ways (MIT / Apache-2.0).
flate2 = "1"
# Checks a document against a JSON Schema, drafts 4 to 2020-12 (MIT). Without its default parts: it never
# fetches a schema from the network and never reads one from disk.
jsonschema = { version = "0.58", default-features = false }
# The patterns of JSONPath's `match` and `search`: time grows with the text, never beyond (MIT / Apache-2.0).
regex = "1"
# The hashes the signature of a token is checked with (MIT / Apache-2.0).
sha2 = "0.10"
# The other digests of the Hash tool: SHA-1, MD5 (of the same family as `sha2`) and CRC-32 (MIT / Apache-2.0).
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
# Random bytes from the operating system, for passwords, secrets and identifiers (MIT / Apache-2.0).
getrandom = "0.3"
# Identifiers: versions 1, 3, 4, 5, 6 and 7 of RFC 9562, made and taken apart (MIT / Apache-2.0).
uuid = { version = "1.27", features = ["v1", "v3", "v4", "v5", "v6", "v7"] }
# Dates, times and time zones (with the zones of the IANA database where the system has none): timestamps and cron (Unlicense / MIT).
jiff = "0.2"
# Takes a URL apart as browsers do (MIT / Apache-2.0).
url = "2"
idna = "1"
# Reads X.509 certificates, from PEM or DER (MIT / Apache-2.0).
x509-parser = "0.18"
# Reads Markdown (CommonMark, with tables, strikethrough, task lists and footnotes) and writes it as HTML (MIT).
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Keys and certificates (RustCrypto, pure Rust). Making RSA keys and signing with them (MIT / Apache-2.0).
rsa = { version = "0.9", features = ["sha2"] }
# The NIST curves: keys and ECDSA signatures (Apache-2.0 / MIT).
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
p521 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
# Ed25519 keys and signatures (BSD-3-Clause).
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
# How keys are written: PKCS #8 (plain, and locked with a passphrase), PKCS #1, SEC 1, SubjectPublicKeyInfo (Apache-2.0 / MIT).
pkcs8 = { version = "0.10", features = ["encryption", "pem", "std"] }
pkcs1 = { version = "0.7", features = ["pem", "std"] }
sec1 = { version = "0.7", features = ["pem", "std"] }
spki = { version = "0.7", features = ["pem", "std"] }
der = { version = "0.7", features = ["pem", "std", "oid"] }
# Certificates and requests for them, written (Apache-2.0 / MIT).
x509-cert = { version = "0.2", features = ["pem", "std"] }
# The key files of OpenSSH, read and written, plain and locked (Apache-2.0 / MIT).
ssh-key = { version = "0.6", features = ["std", "crypto", "encryption", "getrandom"] }
# The ciphers keys were locked with the way OpenSSL once did, to open such keys (MIT / Apache-2.0).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
des = "0.8"
# PKCS #12 files (.pfx, .p12), read and written (MIT / Apache-2.0).
p12-keystore = "0.1"
# The random numbers keys are made from, taken from the operating system (MIT / Apache-2.0).
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { workspace = true }
# `unbounded_depth`: a document nested deeper than 128 levels is read too (on a stack made deep enough for it).
serde_json = { workspace = true, features = ["unbounded_depth"] }
syntelab-app-api = { workspace = true }
# Compares two texts (shared with Scribe).
syntelab-compare = { workspace = true }
# Tells how the bytes of a text are written, and reads them (shared with Scribe).
syntelab-encoding = { workspace = true }
# Everything that goes online, the network tools of Dev among it.
syntelab-net = { workspace = true }
yaml-rust2 = { version = "0.13", default-features = false }
