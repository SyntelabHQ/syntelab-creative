[package]
name = "units-backend"
description = "Units: the Rust side of the app."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Whole numbers of any size and fractions of them: conversions are exact, not rounded at every step (MIT / Apache-2.0).
num-bigint = "0.4"
num-rational = { version = "0.4", features = ["num-bigint"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
syntelab-app-api = { workspace = true }
syntelab-net = { workspace = true }
calamine = { version = "0.36.1", default-features = false }
rust_xlsxwriter = { version = "0.99.1", default-features = false, features = ["constant_memory"] }
arboard = { version = "3.6.1", default-features = false }
